services:
  thinrouter:
    build: .
    image: thinrouter:local
    ports:
      - "20128:20128"
    environment:
      THINROUTER_HOST: "0.0.0.0"
      THINROUTER_PORT: "20128"
      THINROUTER_DATA_DIR: "/data"
      # THINROUTER_ADMIN_TOKEN: "change-me"
      # THINROUTER_SECRETS_KEY: "optional-passphrase"
    volumes:
      - thinrouter-data:/data
    restart: unless-stopped

volumes:
  thinrouter-data:

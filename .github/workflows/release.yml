name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: thinrouter-linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: thinrouter-macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: thinrouter-windows-x86_64
            ext: .exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          EXT="${{ matrix.ext }}"
          BIN="target/${{ matrix.target }}/release/thinrouter${EXT}"
          OUT="${{ matrix.artifact }}${EXT}"
          cp "$BIN" "$OUT"
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            7z a "${{ matrix.artifact }}.zip" "$OUT"
          else
            tar -czf "${{ matrix.artifact }}.tar.gz" "$OUT"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
